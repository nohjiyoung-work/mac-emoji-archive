<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>emoji archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="emoji-data.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header><h1>emoji archive</h1></header>
  <main>
    <div class="toolbar">
      <label class="visually-hidden" for="search">이모티콘 검색</label>
      <input id="search" type="search" placeholder="Search emoji (English) or paste emoji" autocomplete="off" spellcheck="false">
      <span id="count" aria-live="polite"></span>
    </div>
    <nav id="categories" aria-label="카테고리 바로가기"></nav>
    <div id="archive"></div>
    <p id="empty" hidden>검색 결과가 없습니다.</p>
    <p class="note">이모티콘은 현재 기기의 글꼴로 표시됩니다. Mac에서는 Apple Color Emoji를 사용합니다. 클릭하면 투명 PNG로 복사됩니다.</p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
