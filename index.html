<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>emoji archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.grida.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="emoji-data.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <header><h1>emoji archive</h1></header>
  <main>
    <div class="toolbar">
      <label for="search" class="visually-hidden">Search emoji</label>
      <input id="search" type="search" placeholder="Search emoji (English)" autocomplete="off" spellcheck="false">
      <span id="count" aria-live="polite"></span>
    </div>
    <nav id="categories" aria-label="Categories"></nav>
    <div id="archive"></div>
    <p id="empty" hidden>검색 결과가 없습니다.</p>
    <p class="note">Mac · Windows 동일한 Apple PNG 이미지를 표시하도록 설계했습니다. 처음 로딩할 때 인터넷이 필요합니다. 이미지를 클릭하면 PNG를 복사합니다.<br>Apple 이미지 © Apple. 외부 이미지 제공 서버의 운영·접근 정책에 따라 일부 이미지는 나타나지 않거나 복사가 제한될 수 있습니다.</p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
