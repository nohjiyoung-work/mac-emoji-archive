<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이게 내 이모지야!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="fallback-data.js"></script>
  <script defer src="script.js"></script>
  <link rel="icon" type="image/png" href="img/smiling-face-with-horns.png">
</head>
<body>
  <button class="back-to-top back-to-top-left" type="button" aria-label="맨 위로 이동" title="맨 위로 이동"></button>
  <button class="back-to-top back-to-top-right" type="button" aria-label="맨 위로 이동" title="맨 위로 이동"></button>
  <header><h1>emoji archive</h1></header>
  <main>
    <div class="toolbar">
      <label class="visually-hidden" for="search">이모티콘 검색</label>
      <input type="search" id="search" placeholder="Search emoji (English)" autocomplete="off">
      <span id="count" aria-live="polite">준비 중…</span>
    </div>
    <p id="status" class="status" role="status">전체 Apple 이미지 목록을 확인하고 있습니다.</p>
    <nav id="categories" aria-label="카테고리"></nav>
    <div id="archive"></div>
    <p id="empty" hidden>검색 결과가 없습니다.</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
