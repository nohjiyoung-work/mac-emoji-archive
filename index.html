<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>emoji archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="fallback-data.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <header><h1>emoji archive</h1></header>
  <main>
    <div class="toolbar">
      <label class="visually-hidden" for="search">이모티콘 검색</label>
      <input type="search" id="search" placeholder="Search emoji (English)" autocomplete="off">
      <span id="count" aria-live="polite">준비 중…</span>
    </div>
    <p id="status" class="status" role="status">전체 Apple 이미지 목록을 확인하고 있습니다.</p>
    <nav id="categories" aria-label="카테고리"></nav>
    <div id="archive"></div>
    <p id="empty" hidden>검색 결과가 없습니다.</p>
    <p class="note">목록 순서는 Unicode CLDR 정렬을 따르며 Emojipedia의 순서와 일부 차이가 있을 수 있습니다. Apple PNG를 사용합니다. 클릭하면 원본 PNG를 복사합니다. 외부 CDN이 차단되면 `download_emojis.py`를 한 번 실행해 이미지를 로컬에 저장하세요.<br>Apple 이모티콘 이미지 © Apple. 공개 배포·업무상 이미지 재사용 권한은 별도 확인이 필요합니다.</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
